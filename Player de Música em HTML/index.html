<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player de Música</title>
<meta name="description" content="Um player de música comum">
<meta property="og:type" content="website">
<meta property="og:title" content="Player de música">
<meta property="og:description" content="Um Player de música comum">
<link rel="stylesheet" href="./style.css"> 
<script src="./script.js" defer></script>
</head>
<body>
  <div class="player" id="player">
    <div class="cover">
        <canvas id="viz"></canvas>
        <div class="note">♪</div>
  </div>

  <div class="info">
    <div class="title" id="title"> Nenhuma música </div>
    <div class="subtitle" id="subtitle"> Adicione arquivos de áudio para começar</div>
  </div>

  <div class="progress-wrap">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
    <span id="dur">0:00</span>
 </div>

 <div class="controls">
    <button class="btn-side" id="shuffle" title="Aleatório (S)">
      <svg viewBox="0 0 24 24"><path d="M10.6 9.2 4.4 3 3 4.4l6.2 6.2 1.4-1.4zM14.5 4l2.0 2-12.6 12.6L5.4 20 18 7.4l2 2V4h-5.5zm.7 9.8-1.4 1.4 3.2 3.2-2 2H20v-5.5l-2 2-2.8-3.1z"/></svg>
    </button>
    <button class="btn-skip" id="prev" title="Anterior (←)">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="btn-play" id="play" title="Tocar / Pausar (Espaço)">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn-skip" id="next" title="Próxima (→)">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="btn-side" id="repeat" title="Repetir (R)">
      <svg viewBox="0 0 24 24" id="repeatIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>

  <div class="volume">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div class="toolbar">
    <button class="add-btn" id="addBtn">➕ Adicionar músicas</button>
    <button class="add-btn" id="clearBtn" style="flex:0 0 auto">🗑 Limpar</button>
  </div>
  <input type="file" id="file" accept="audio/*" multiple hidden>

  <ul class="playlist" id="list"></ul>
  <div class="hint">Arraste arquivos aqui · Espaço: play/pause · ← →: faixa · ↑ ↓: volume</div>
</div>
</body>
</html>
